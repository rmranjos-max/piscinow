name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache do modelo de embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-MiniLM-L12-v2

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Rodar a suite completa (Postgres + pgvector via testcontainers)
        run: pytest -q -rfE --tb=short -p no:cacheprovider

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PISCINOW_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar so o necessario para o Alembic
        run: |
          pip install --no-deps -e .
          pip install alembic sqlalchemy "psycopg[binary]" pgvector pydantic-settings argon2-cffi

      - name: Subir as migrations num banco vazio
        run: alembic upgrade head

      - name: Conferir que os modelos nao divergem das migrations
        run: alembic check

      - name: Descer tudo e subir de novo
        run: |
          alembic downgrade base
          alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t piscinow:ci .

      - name: A imagem roda sem root
        run: test "$(docker run --rm --entrypoint id piscinow:ci -u)" != "0"

      - name: O modelo de embeddings esta dentro da imagem
        run: docker run --rm --entrypoint python piscinow:ci -c "from piscinow.agent.embeddings import embed_text; print(len(embed_text('teste')))"

      - name: Producao recusa subir com o segredo padrao
        run: |
          if docker run --rm -e PISCINOW_ENVIRONMENT=production -e PISCINOW_SESSION_SECRET=change-me-in-production piscinow:ci python -c "import piscinow.web.app"; then
            echo "O app deveria ter recusado subir com o segredo padrao" >&2
            exit 1
          fi

      - name: Subir migrations e app e sondar a saude
        run: |
          ENVS="-e PISCINOW_ENVIRONMENT=production -e PISCINOW_SESSION_SECRET=$(openssl rand -hex 32) -e PISCINOW_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/postgres"
          docker run --rm --network host $ENVS piscinow:ci alembic upgrade head
          docker run -d --name app --network host $ENVS piscinow:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' http://127.0.0.1:8000/comprador/login)" = "403"
          curl -s -D - -o /dev/null http://127.0.0.1:8000/loja/definir-senha/token-inexistente | grep -i '^referrer-policy: no-referrer'
          ! docker logs app 2>&1 | grep -q 'definir-senha/token-inexistente'
          for i in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' app)"
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          echo "HEALTHCHECK do container: $status"
          [ "$status" = "healthy" ]

      - name: Logs do app
        if: always()
        run: docker logs app || true

      - name: Validar o Caddyfile
        run: >
          docker run --rm -e PISCINOW_DOMAIN=example.com
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validar o docker-compose.yml
        run: POSTGRES_PASSWORD=x PISCINOW_SESSION_SECRET=y docker compose config -q

  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PISCINOW_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar so o necessario para o Alembic
        run: |
          pip install --no-deps -e .
          pip install alembic sqlalchemy "psycopg[binary]" pgvector pydantic-settings argon2-cffi

      - name: Criar o schema e um registro de teste
        run: |
          alembic upgrade head
          DB_EXEC="docker exec -i $(docker ps -q --filter ancestor=pgvector/pgvector:pg16)"
          $DB_EXEC psql -U postgres -d postgres -c "INSERT INTO admin_users (id, email, password_hash, created_at) VALUES (gen_random_uuid(), 'backup-test@example.com', 'x', now())"

      - name: Backup e restauracao num banco descartavel
        run: |
          export DB_EXEC="docker exec -i $(docker ps -q --filter ancestor=pgvector/pgvector:pg16)"
          file="$(bash scripts/backup.sh)"
          ls -l "$file"
          test "$(stat -c %a "$file")" = "600"
          test "$(stat -c %a "$(dirname "$file")")" = "700"
          CHECK_SQL="SELECT count(*) FROM admin_users WHERE email = 'backup-test@example.com'" bash scripts/restore-check.sh "$file"
